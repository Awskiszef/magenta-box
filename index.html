                    {% }
                %}

            </div>

                                        <img class="mob_hide" src="images/FGA2233-D.png" alt="router"/>

                                        <img class="mob_hide" src="images/FAST5670-D-warning.png" alt="router"/>

                                            else { %}
                                                <div class="status-item">
                                                    <span class="gry"></span>
                                                    <span data-label="LAN_DISCON"></span>
                                                </div>
                                            {% }
                                        %}
                                    {% }
                                %}

                                <div class="status-item">
                                    {%
                                        if (o.wifiStatus) { %}
                                            <span class="grn"></span>
                                            <span data-label="WIFI_CONN_STATUS"></span>

                                        else { %}
                                            <span class="gry"></span>
                                            <span data-label="WIFI_INACTIVE"></span>
                                        {% }
                                    %}
