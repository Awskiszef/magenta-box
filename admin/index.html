<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>magenta.box admin</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen hidden">
    <section class="login-panel" aria-labelledby="loginTitle">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>
          <strong>magenta.box</strong>
          <small>router control center</small>
        </span>
      </div>
      <div class="language-toggle language-toggle-login" role="group" aria-label="Language">
        <button type="button" data-lang="pl">PL</button>
        <button type="button" data-lang="en">EN</button>
      </div>

      <div class="login-copy">
        <p class="eyebrow" data-i18n="login.eyebrow">Panel administracyjny</p>
        <h1 id="loginTitle" data-i18n="login.title">Zarządzaj siecią bez zgadywania.</h1>
        <p data-i18n="login.copy">Live status, konfiguracja Wi-Fi, diagnostyka i logi w jednym czystym widoku.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label>
          <span>Login</span>
          <input id="loginUser" name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          <span data-i18n="login.password">Hasło</span>
          <input id="loginPass" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="loginError" class="form-alert hidden" role="alert"></p>
        <button class="btn btn-primary btn-wide" type="submit" data-i18n="login.submit">Zaloguj</button>
        <p class="login-hint"><span data-i18n="login.demo">Demo:</span> <code>admin</code> / <code>admin</code></p>
      </form>
    </section>
  </div>

  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar" aria-label="Nawigacja" data-i18n-aria-label="aria.sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>
          <strong>magenta.box</strong>
          <small id="sysModelLabel">router</small>
        </span>
      </div>

      <nav class="nav-list" aria-label="Główne widoki" data-i18n-aria-label="aria.nav">
        <button class="nav-item active" type="button" data-view="dashboard">
          <span class="icon" data-icon="dashboard" aria-hidden="true"></span>
          <span data-i18n="nav.dashboard">Dashboard</span>
        </button>
        <button class="nav-item" type="button" data-view="wifi">
          <span class="icon" data-icon="wifi" aria-hidden="true"></span>
          <span data-i18n="nav.wifi">Wi-Fi</span>
        </button>
        <button class="nav-item" type="button" data-view="network">
          <span class="icon" data-icon="network" aria-hidden="true"></span>
          <span data-i18n="nav.network">Sieć</span>
        </button>
        <button class="nav-item" type="button" data-view="devices">
          <span class="icon" data-icon="devices" aria-hidden="true"></span>
          <span data-i18n="nav.devices">Urządzenia</span>
        </button>
        <button class="nav-item" type="button" data-view="diagnostics">
          <span class="icon" data-icon="tools" aria-hidden="true"></span>
          <span data-i18n="nav.diagnostics">Diagnostyka</span>
        </button>
        <button class="nav-item" type="button" data-view="logs">
          <span class="icon" data-icon="logs" aria-hidden="true"></span>
          <span data-i18n="nav.logs">Logi</span>
        </button>
        <button class="nav-item" type="button" data-view="system">
          <span class="icon" data-icon="system" aria-hidden="true"></span>
          <span data-i18n="nav.system">System</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="language-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="pl">PL</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <div class="user-chip">
          <span class="avatar" aria-hidden="true">A</span>
          <span>
            <small data-i18n="sidebar.logged">Zalogowany</small>
            <strong id="navUser">-</strong>
          </span>
        </div>
        <div class="sidebar-actions">
          <button id="darkToggle" class="icon-btn" type="button" title="Zmień motyw" aria-label="Zmień motyw" data-i18n-title="aria.theme" data-i18n-aria-label="aria.theme">
            <span class="icon" data-icon="moon" aria-hidden="true"></span>
          </button>
          <button id="logoutBtn" class="icon-btn" type="button" title="Wyloguj" aria-label="Wyloguj" data-i18n-title="aria.logout" data-i18n-aria-label="aria.logout">
            <span class="icon" data-icon="logout" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </aside>

    <div id="sidebarScrim" class="sidebar-scrim hidden"></div>

    <main class="workspace">
      <header class="topbar">
          <button id="menuToggle" class="icon-btn mobile-only" type="button" title="Menu" aria-label="Otwórz menu" data-i18n-aria-label="aria.menu">
          <span class="icon" data-icon="menu" aria-hidden="true"></span>
        </button>
        <div class="title-block">
          <p id="viewSub" class="eyebrow">Stan urządzenia w czasie rzeczywistym</p>
          <h1 id="viewTitle">Dashboard</h1>
        </div>
        <div class="topbar-status">
          <span id="liveDot" class="live-dot" aria-hidden="true"></span>
          <span data-i18n="topbar.live">live</span>
          <strong id="uptimeBadge">--:--:--</strong>
        </div>
      </header>

      <section id="viewport" class="viewport" aria-live="polite"></section>
    </main>
  </div>

  <div id="toasts" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
